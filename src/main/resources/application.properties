server.port=${SERVER_PORT:8080}
spring.application.name=java-ai-code-reviewer
server.error.include-message=never
app.github.token=${GITHUB_TOKEN:}
app.github.webhook-secret=${GITHUB_WEBHOOK_SECRET:}
app.github.api-base=${GITHUB_API_BASE:https://api.github.com}
app.openai.api-key=${OPENAI_API_KEY:}
app.openai.model=${OPENAI_MODEL:gpt-4.1-mini}
app.openai.api-url=${OPENAI_API_URL:https://api.openai.com/v1/chat/completions}
